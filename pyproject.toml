[project]
name = "oc-p13"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "codecarbon>=3.3.0",
    "gradio>=6.25.0",
    "mapie>=1.5.0",
    "matplotlib>=3.11.1",
    "mlflow>=3",
    "numpy>=2.5.2",
    "pandas<3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "spaces==0.51.1",
    "tabpfn>=8.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # gr.Warning is a real UserWarning outside a Gradio request context; one
    # test asserts on it, so it must not be turned into an error.
    "default::UserWarning",
]
